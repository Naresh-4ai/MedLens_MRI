version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medlens_qdrant

    restart: always

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


  neo4j:
    image: neo4j:5

    container_name: medlens_neo4j

    restart: always

    environment:
      NEO4J_AUTH: neo4j/password

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data


volumes:


  neo4j_data:

  qdrant_data:
